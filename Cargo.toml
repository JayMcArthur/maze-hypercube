[package]
name = "hypercube-maze"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

[profile.release]
lto = "thin"
strip = true
